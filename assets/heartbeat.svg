<svg width="680" height="110" viewBox="0 0 680 110" xmlns="http://www.w3.org/2000/svg">
  <title>Heartbeat</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="680" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E96443"/>
      <stop offset="0.5" stop-color="#F06292"/>
      <stop offset="1" stop-color="#904E95"/>
    </linearGradient>
    <radialGradient id="heartFill" cx="38%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#FF8A80"/>
      <stop offset="45%" stop-color="#F04A52"/>
      <stop offset="100%" stop-color="#7A1F2B"/>
    </radialGradient>
    <style>
      @keyframes sweepHead { from { stroke-dashoffset: 1200; } to { stroke-dashoffset: 0; } }
      @keyframes sweepT1   { from { stroke-dashoffset: 1060; } to { stroke-dashoffset: -140; } }
      @keyframes sweepT2   { from { stroke-dashoffset: 970; } to { stroke-dashoffset: -230; } }
      @keyframes sweepT3   { from { stroke-dashoffset: 880; } to { stroke-dashoffset: -320; } }
      @keyframes sweepT4   { from { stroke-dashoffset: 790; } to { stroke-dashoffset: -410; } }
      @keyframes breathe {
        0%,100% { transform: scale(1); }
        10%     { transform: scale(1.045); }
        20%     { transform: scale(0.985); }
        32%     { transform: scale(1.06); }
        44%     { transform: scale(0.99); }
        60%     { transform: scale(1.015); }
        78%     { transform: scale(0.995); }
      }
      @keyframes glowB {
        0%,100% { opacity: 0.14; }
        32%     { opacity: 0.34; }
        60%     { opacity: 0.22; }
      }
      .head { stroke-dasharray: 140 1060; animation: sweepHead 5s linear infinite; }
      .t1   { stroke-dasharray: 90 1110;  animation: sweepT1 5s linear infinite; }
      .t2   { stroke-dasharray: 90 1110;  animation: sweepT2 5s linear infinite; }
      .t3   { stroke-dasharray: 90 1110;  animation: sweepT3 5s linear infinite; }
      .t4   { stroke-dasharray: 80 1120;  animation: sweepT4 5s linear infinite; }
      .heart { transform-box: fill-box; transform-origin: center; animation: breathe 2.4s ease-in-out infinite; }
      .glow  { animation: glowB 2.4s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="680" height="110" rx="16" fill="#0D1117"/>
  <circle class="glow" cx="39" cy="55" r="30" fill="url(#line)"/>
  <g class="heart">
