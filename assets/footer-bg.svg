<svg width="960" height="120" viewBox="0 0 960 120" xmlns="http://www.w3.org/2000/svg"><title>farm field strip</title><style>
rect,polygon{shape-rendering:crispEdges}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.3)}}
.wing{transform-box:fill-box;transform-origin:center;animation:flap .3s ease-in-out infinite}
@keyframes bfly{0%{transform:translate(-40px,70px)}25%{transform:translate(240px,58px)}50%{transform:translate(520px,76px)}75%{transform:translate(800px,60px)}100%{transform:translate(1020px,70px)}}
.bfly{animation:bfly 24s linear infinite}
@keyframes cloudd{from{transform:translateX(-120px)}to{transform:translateX(1060px)}}
.cloud1{animation:cloudd 70s linear infinite}
@keyframes bird{from{transform:translateX(-60px)}to{transform:translateX(1020px)}}
.bird{animation:bird 16s linear infinite}
.bird2{animation:bird 22s linear infinite;animation-delay:-8s}
