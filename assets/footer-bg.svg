<svg width="960" height="240" viewBox="0 0 960 240" xmlns="http://www.w3.org/2000/svg"><title>farm field strip</title><style>
rect,polygon{shape-rendering:crispEdges}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.3)}}
.wing{transform-box:fill-box;transform-origin:center;animation:flap .3s ease-in-out infinite}
@keyframes bfly{0%{transform:translate(-40px,170px)}25%{transform:translate(240px,150px)}50%{transform:translate(520px,180px)}75%{transform:translate(800px,155px)}100%{transform:translate(1020px,170px)}}
.bfly{animation:bfly 26s linear infinite}
@keyframes cloudd{from{transform:translateX(-140px)}to{transform:translateX(1060px)}}
.cloud1{animation:cloudd 70s linear infinite}
.cloud2{animation:cloudd 90s linear infinite;animation-delay:-40s}
@keyframes bird{from{transform:translateX(-60px)}to{transform:translateX(1020px)}}
.bird{animation:bird 18s linear infinite}
.bird2{animation:bird 24s linear infinite;animation-delay:-9s}
