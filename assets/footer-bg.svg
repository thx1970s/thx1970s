<svg width="960" height="150" viewBox="0 0 960 150" xmlns="http://www.w3.org/2000/svg"><title>footer grass strip</title><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9E8F5"/><stop offset="1" stop-color="#EAF6E8"/></linearGradient><linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CC79A"/><stop offset="1" stop-color="#7FB069"/></linearGradient><style>
@keyframes rab{from{transform:translateX(-60px)}to{transform:translateX(1020px)}}
.rabbit{animation:rab 34s linear infinite}
@keyframes hop{0%,100%{transform:translateY(0)}25%{transform:translateY(-8px)}50%{transform:translateY(0)}75%{transform:translateY(-8px)}}
.hop{animation:hop .9s linear infinite}
@keyframes flapL{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.3)}}
.wingL{transform-box:fill-box;transform-origin:right center;animation:flapL .3s ease-in-out infinite}
.wingR{transform-box:fill-box;transform-origin:left center;animation:flapR .3s ease-in-out infinite}
@keyframes flapR{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.3)}}
@keyframes bfly{0%{transform:translate(-40px,115px)}25%{transform:translate(240px,95px)}50%{transform:translate(520px,120px)}75%{transform:translate(800px,100px)}100%{transform:translate(1020px,115px)}}
.bfly{animation:bfly 26s linear infinite}
