<svg width="960" height="140" viewBox="0 0 960 140" xmlns="http://www.w3.org/2000/svg"><title>farm field strip</title><style>
rect,polygon{shape-rendering:crispEdges}
@keyframes rab{from{transform:translateX(-60px)}to{transform:translateX(1020px)}}
.rabbit{animation:rab 34s linear infinite}
@keyframes hop{0%,100%{transform:translateY(0)}25%{transform:translateY(-8px)}50%{transform:translateY(0)}75%{transform:translateY(-8px)}}
.hop{animation:hop .9s linear infinite}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.3)}}
.wing{transform-box:fill-box;transform-origin:center;animation:flap .3s ease-in-out infinite}
@keyframes bfly{0%{transform:translate(-40px,105px)}25%{transform:translate(240px,85px)}50%{transform:translate(520px,110px)}75%{transform:translate(800px,90px)}100%{transform:translate(1020px,105px)}}
.bfly{animation:bfly 26s linear infinite}
