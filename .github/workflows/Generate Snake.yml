# GitHub Action for generating a contribution graph with a snake eating your contributions.
# Note: the old version pinned Platane/snk@master, which was deprecated in 2023
# (the workflow silently stopped updating the assets after 2023-07-15).
# This version uses Platane/snk@v3 with the new `outputs` syntax.

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.gif
            assets/github-contribution-grid-snake.svg

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'Generate Contribution Snake'
            git push
          fi
